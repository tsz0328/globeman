# ============================================================
# quanqiuren-web 前端部署 + /api 反向代理配置
# 作用：把浏览器发往 https://111.23.252.161:443/api/xxx 的请求
#       转发到后端 http://111.23.252.161:8080/xxx （与 Vite dev 代理行为一致）
# ============================================================

server {
    listen 443 ssl;
    server_name 111.23.252.161;   # 如有域名改成你的域名

    # ---- SSL 证书（按你服务器实际路径修改）----
    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ---- 前端静态资源（vite build 产物目录，按实际路径修改）----
    root /var/www/quanqiuren-web/static;
    index index.html;

    # ---- 前端页面（Vue history 模式路由，未匹配到文件时回退 index.html）----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- /api 反向代理 → 后端 8080 ----
    # 注意 proxy_pass 末尾的 "/" ：与 Vite dev 代理的 rewrite(/^\/api/ -> '')
    # 等价，会把 /api 前缀剥离，转发为 http://111.23.252.161:8080/xxx
    location /api/ {
        proxy_pass http://111.23.252.161:8080/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时（前端 axios timeout 为 3s，这里略放宽防止偶发慢请求被砍）
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}

# ---- 可选：HTTP 80 强制跳 HTTPS ----
server {
    listen 80;
    server_name 111.23.252.161;
    return 301 https://$host$request_uri;
}
